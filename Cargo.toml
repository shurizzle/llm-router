[package]
name = "llm-router"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "alloc"] }
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
parking_lot = "0.13"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12", "logging"] }
prometheus = { version = "0.14", features = ["process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
tower-service = "0.3"
url = "2"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
notify = { version = "8.2.1", optional = true }

[dev-dependencies]
schemars = "1"

[profile.release]
lto = true
strip = true

[features]
default = ["watch"]
# Reload the config file automatically when it changes on disk.
watch = ["dep:notify"]
